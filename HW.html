<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="container mx-auto">
    <header class="z-50 sticky top-1 bg-white">
        <section class="flex justify-between items-center mt-5">
            <div>
                <h3 class="font-bold text-[#000000] text-3xl">Book Vibe</h3>
            </div>
            <div class="flex justify-between items-center">
                <button
                    class="bg-white border border-[#23BE0A] rounded-lg text-[#23BE0A] font-semibold text-lg px-5 py-3.5">Home</button>
                <button class="hidden sm:block bg-white text-lg text-[#131313] px-4 py-3.5">Listed books</button>
                <button class="hidden sm:block bg-white text-lg text-[#131313] px-4 py-3.5">Pages to Read</button>
            </div>
            <div class="flex justify-between space-x-4">
                <button class="bg-[#23BE0A] rounded-lg text-white font-semibold text-lg px-7 py-5 ">sign in</button>
                <button class="hidden sm:block bg-[#59C6D2] rounded-lg text-white font-semibold text-lg px-7 py-5 ">sign
                    up</button>
            </div>
        </section>
    </header>
    <main>
        <section class="flex justify-between items-center border border-[#000000] bg-[#F3F3F3] rounded-2xl mt-15 p-40">
            <div class="space-y-10">
                <h3 class="font-bold text-7xl">Book to freshen up <br>your bookshelf</h3>
                <button class="bg-[#23BE0A] rounded-lg px-7 py-5 font-bold text-white">Viwe The List</button>
            </div>
            <div><img src="./ASL_Assignment_Resources/assets/Banner.png" alt=""></div>
        </section>
    </main>
    <footer>

    </footer>

</body>
